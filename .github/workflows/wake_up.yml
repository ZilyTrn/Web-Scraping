name: Wake Up Render Server

on:
  schedule:
    # Run every 5 minutes (Render sleeps after 15 minutes of inactivity)
    - cron: '*/5 * * * *'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Web Service
        run: |
          echo "Pinging https://linh-weather.onrender.com..."
          curl -I -s https://linh-weather.onrender.com | head -n 1
